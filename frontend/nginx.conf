server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = / { return 302 /secgrad/; }
    location = /secgrad { return 302 /secgrad/; }
    location /secgrad/ { try_files $uri $uri/ /secgrad/index.html; }
    location /secgrad/assets/ { try_files $uri =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
